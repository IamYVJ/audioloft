<!--
  AudioLoft icon: five waveform bars rising to a peak, which doubles as the
  roofline of a loft. This rounded version is the favicon; the PNGs are
  rendered full-bleed from the same geometry so they work as maskable icons.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="AudioLoft">
    <title>AudioLoft</title>
    <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffc66e"/>
            <stop offset="1" stop-color="#ff7a59"/>
        </linearGradient>
    </defs>
    <rect width="512" height="512" rx="144" fill="url(#g)"/>
    <g fill="#1d1206">
        <rect x="112" y="276" width="40" height="112" rx="20"/>
        <rect x="174" y="206" width="40" height="182" rx="20"/>
        <rect x="236" y="124" width="40" height="264" rx="20"/>
        <rect x="298" y="206" width="40" height="182" rx="20"/>
        <rect x="360" y="276" width="40" height="112" rx="20"/>
    </g>
</svg>
